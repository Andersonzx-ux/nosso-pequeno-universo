<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="shoppingBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261420"/>
      <stop offset="50%" stop-color="#3D1D2B"/>
      <stop offset="100%" stop-color="#582436"/>
    </linearGradient>
    <linearGradient id="glassArches" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D49A9E" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#FFF2B2" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#D49A9E" stop-opacity="0.15"/>
    </linearGradient>
    <radialGradient id="warmLight" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFEBB4" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFEBB4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tableGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8E4351"/>
      <stop offset="100%" stop-color="#4F1E29"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBB3B7"/>
      <stop offset="100%" stop-color="#C26D77"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#shoppingBg)" rx="16"/>

  <!-- Warm ambient glow -->
  <circle cx="200" cy="110" r="160" fill="url(#warmLight)"/>

  <!-- Shopping Mall Galleria / Glass Dome Architecture -->
  <path d="M50,160 Q200,20 350,160" fill="none" stroke="url(#glassArches)" stroke-width="2"/>
  <path d="M100,160 Q200,50 300,160" fill="none" stroke="url(#glassArches)" stroke-width="1.5"/>
  <path d="M150,160 Q200,80 250,160" fill="none" stroke="url(#glassArches)" stroke-width="1.2"/>
  <line x1="200" y1="35" x2="200" y2="160" stroke="#FFEBB4" stroke-width="1" opacity="0.25"/>
  <line x1="140" y1="70" x2="170" y2="160" stroke="#FFEBB4" stroke-width="1" opacity="0.2"/>
  <line x1="260" y1="70" x2="230" y2="160" stroke="#FFEBB4" stroke-width="1" opacity="0.2"/>

  <!-- Mall Boutique Storefront Silhouettes in Background -->
  <rect x="25" y="105" width="70" height="60" rx="4" fill="#311522" opacity="0.7"/>
  <rect x="35" y="115" width="50" height="35" rx="2" fill="#FFEAA7" opacity="0.25"/>
  
  <rect x="305" y="105" width="70" height="60" rx="4" fill="#311522" opacity="0.7"/>
  <rect x="315" y="115" width="50" height="35" rx="2" fill="#FFEAA7" opacity="0.25"/>

  <!-- Hanging Fairy Lights / Festoon string across the mall -->
  <path d="M20,65 Q110,95 200,75 Q290,95 380,65" fill="none" stroke="#FFE699" stroke-width="1.2" opacity="0.5"/>
  <circle cx="60" cy="74" r="3.5" fill="#FFF275"/>
  <circle cx="110" cy="84" r="3" fill="#FFEAA7"/>
  <circle cx="160" cy="80" r="3.5" fill="#FFF275"/>
  <circle cx="200" cy="75" r="4" fill="#FFFDF0"/>
  <circle cx="240" cy="80" r="3.5" fill="#FFF275"/>
  <circle cx="290" cy="84" r="3" fill="#FFEAA7"/>
  <circle cx="340" cy="74" r="3.5" fill="#FFF275"/>

  <!-- Bokeh orbs -->
  <circle cx="90" cy="110" r="8" fill="#FFE8A3" opacity="0.15"/>
  <circle cx="280" cy="95" r="12" fill="#FFD1DC" opacity="0.15"/>
  <circle cx="130" cy="50" r="6" fill="#FFF" opacity="0.2"/>
  <circle cx="310" cy="130" r="9" fill="#FFEAA7" opacity="0.15"/>

  <!-- Floor reflection -->
  <ellipse cx="200" cy="245" rx="170" ry="35" fill="#200E19" opacity="0.7"/>

  <!-- Bistro / Café Table -->
  <ellipse cx="200" cy="195" rx="75" ry="16" fill="url(#tableGrad)"/>
  <ellipse cx="200" cy="193" rx="72" ry="14" fill="#9C4B5B"/>
  <!-- Table Stand -->
  <path d="M197,208 L197,246 L185,252 L215,252 L203,246 L203,208 Z" fill="#38131E"/>

  <!-- Left Coffee Cup & Saucer -->
  <ellipse cx="175" cy="190" rx="14" ry="4.5" fill="#EAD5C3"/>
  <path d="M164,185 Q164,196 175,196 Q186,196 186,185 Z" fill="#FDFBF7"/>
  <ellipse cx="175" cy="185" rx="11" ry="3.5" fill="#7B4228"/>
  <path d="M185,187 Q192,187 190,192 Q188,195 184,193" fill="none" stroke="#FDFBF7" stroke-width="2"/>
  <!-- Latte Art mini heart -->
  <path d="M175,184 C173,182 170,183 171,185.5 L175,188 L179,185.5 C180,183 177,182 175,184 Z" fill="#FBF5ED"/>

  <!-- Right Coffee Cup & Saucer -->
  <ellipse cx="225" cy="190" rx="14" ry="4.5" fill="#EAD5C3"/>
  <path d="M214,185 Q214,196 225,196 Q236,196 236,185 Z" fill="#FDFBF7"/>
  <ellipse cx="225" cy="185" rx="11" ry="3.5" fill="#6A361E"/>
  <path d="M235,187 Q242,187 240,192 Q238,195 234,193" fill="none" stroke="#FDFBF7" stroke-width="2"/>

  <!-- Rising steam in heart shape -->
  <path d="M175,178 Q170,166 178,158 Q186,150 184,142" fill="none" stroke="#FFF2E8" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M225,178 Q230,166 222,158 Q214,150 216,142" fill="none" stroke="#FFF2E8" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  <path d="M200,138 C196,132 189,135 192,141 L200,149 L208,141 C211,135 204,132 200,138 Z" fill="#FFC0CB" opacity="0.8"/>

  <!-- Shopping Bag beside table -->
  <polygon points="102,192 138,187 132,238 96,243" fill="url(#bagGrad)"/>
  <polygon points="138,187 144,194 138,245 132,238" fill="#A85762"/>
  <!-- Bag handles -->
  <path d="M112,190 Q120,172 128,188" fill="none" stroke="#FAF0E6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Small heart on the shopping bag -->
  <path d="M117,212 C115,209 111,211 112,214 L117,219 L122,214 C123,211 119,209 117,212 Z" fill="#FFF"/>

  <!-- Romantic Sparkles -->
  <polygon points="265,155 268,161 274,163 268,165 265,171 262,165 256,163 262,161" fill="#FFEAA7" opacity="0.85"/>
  <polygon points="80,145 82,149 86,150 82,151 80,155 78,151 74,150 78,149" fill="#FFF275" opacity="0.7"/>

  <!-- Caption typography -->
  <text x="200" y="275" font-family="'Playfair Display', Georgia, serif" font-size="15" font-weight="600" fill="#FDF8F5" text-anchor="middle" letter-spacing="0.5">O Nosso Primeiro Encontro</text>
  <text x="200" y="290" font-family="sans-serif" font-size="11" fill="#E8B4B8" text-anchor="middle">Um café no shopping que durou a tarde inteira</text>
</svg>
